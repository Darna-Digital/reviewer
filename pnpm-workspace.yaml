packages:
  - packages/*

allowBuilds:
  better-sqlite3: false
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  workerd: true

# `@pierre/diffs` pins the code column's height while an edit rebuilds it, so
# WebKit does not clamp the scroller to the top on every keystroke
# (https://bugs.webkit.org/show_bug.cgi?id=308027). As shipped the guard never
# runs in the macOS app: `VirtualizedFile` turns it off outright, and
# `isSafari()` misses a WKWebView, whose user agent names no Safari. Beside
# keeping the sprite sheet across clean-ups, the patch lets a file under the simple `Virtualizer` keep the guard, and counts any
# non-Chromium WebKit as Safari.
patchedDependencies:
  '@pierre/diffs@1.5.1': patches/@pierre__diffs@1.5.1.patch

# Security floors for transitive pins Dependabot flagged: miniflare pins
# sharp@0.35.4 and solid-js@1.9.15 pins seroval ~1.5.4.
overrides:
  sharp@<0.35.5: ^0.35.5
  seroval@<1.6.3: ^1.6.8
  seroval-plugins@<1.6.3: ^1.6.8
