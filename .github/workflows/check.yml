name: check

# Runs on PRs for validation.
on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # The terminal UI (packages/tui) runs on Bun — OpenTUI's native core is
      # loaded through Bun's FFI — and so do its tests.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Check formatting
        run: pnpm -r --if-present format:check

      - name: Test
        run: pnpm -r --if-present test
