name: check

# Runs on PRs for validation, and is called by the release workflows
# (staging/master) as a gating job before they sign and publish.
on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # The desktop package is skipped here: installing it downloads Electron,
      # which none of the checks below need. The exclusion carries no `...`
      # suffix — that would also drop desktop's dependencies, and `@byconvo/lint`
      # is one of them, leaving every other package's eslint.config.js unable to
      # resolve the shared ruleset it imports.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "!@byconvo/desktop"

      # Excluded from the runs as well as the install: desktop's own scripts
      # would look for a prettier that was never installed.
      - name: Lint
        run: pnpm -r --if-present --filter "!@byconvo/desktop" lint

      - name: Check formatting
        run: pnpm -r --if-present --filter "!@byconvo/desktop" format:check

      - name: Test
        run: pnpm -r --if-present --filter "!@byconvo/desktop" test
