name: release-beta

# Beta channel. Every push to `staging` builds a full both-arch prerelease
# (X.Y.Z-beta.<run>) and publishes it to the darna-digital/byconvo-beta
# repository. The base X.Y.Z comes from packages/desktop/package.json; the run
# number keeps each build newer than the last.
#
# Beta builds are code-signed with the Developer ID certificate but NOT
# notarized — notarization (the slow, Apple-side step) is reserved for the
# production channel on `master`. A signed-but-unnotarized app opens with a
# right-click -> Open (the mild "unidentified developer" prompt), no Terminal
# needed, unlike a fully unsigned app which macOS reports as "damaged".
#
# Secrets used:
#   BETA_GITHUB_TOKEN           PAT with contents:write on darna-digital/byconvo-beta
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password for that .p12

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: release-beta
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Resolve beta version
        id: v
        run: |
          BASE=$(node -p "require('./packages/desktop/package.json').version")
          echo "version=${BASE}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer, server, and main process
        run: pnpm build:desktop

      # Sign with the auto-discovered Developer ID cert (no -c.mac.identity=null)
      # but skip notarization (-c.mac.notarize=false) so there's no Apple-side
      # wait. --publish never: electron-builder just packages; the release is
      # created below.
      - name: Package (signed, not notarized, both arches)
        run: >
          pnpm --filter @byconvo/desktop exec electron-builder
          --mac --arm64 --x64
          --config electron-builder.config.js
          -c.extraMetadata.version=${{ steps.v.outputs.version }}
          -c.mac.notarize=false
          --publish never
        env:
          BYCONVO_CHANNEL: beta
          # Verbose electron-builder output so the packaging/signing step streams
          # progress (each binary as it's signed) instead of sitting silent.
          DEBUG: electron-builder

      # Publish with the gh CLI rather than electron-builder's own publisher:
      # the build runs in this repo but the release lives in byconvo-beta, and
      # electron-builder anchors the tag to a commit from *this* checkout that
      # doesn't exist there. `gh release create --target main` anchors the tag to
      # byconvo-beta's own default branch, which is the valid reference.
      - name: Publish signed build to byconvo-beta
        env:
          GH_TOKEN: ${{ secrets.BETA_GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            packages/desktop/dist-packaged/*.dmg \
            --repo darna-digital/byconvo-beta \
            --target main \
            --title "Byconvo Beta v${{ steps.v.outputs.version }}" \
            --notes "Signed beta build (not notarized). On first launch, right-click the app and choose Open, then confirm." \
            --prerelease
