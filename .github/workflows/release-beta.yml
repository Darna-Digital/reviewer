name: release-beta

# Beta channel. Every push to `staging` builds a full both-arch prerelease
# (X.Y.Z-beta.<run>) and publishes it to the darna-digital/byconvo-beta
# repository. The base X.Y.Z comes from packages/desktop/package.json; the run
# number keeps each build newer than the last.
#
# Beta builds are intentionally NOT signed or notarized — that is reserved for
# the production channel on `master`. As a result a beta build cannot
# auto-update (macOS only applies signed updates) and Gatekeeper flags it on
# first launch: testers download the latest build from byconvo-beta and
# right-click -> Open once. Auto-update is a production-only feature.
#
# Secrets used:
#   BETA_GITHUB_TOKEN  PAT with contents:write on darna-digital/byconvo-beta

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: release-beta
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Resolve beta version
        id: v
        run: |
          BASE=$(node -p "require('./packages/desktop/package.json').version")
          echo "version=${BASE}-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer, server, and main process
        run: pnpm build:desktop

      - name: Package (unsigned) and publish to byconvo-beta
        run: >
          pnpm --filter @byconvo/desktop exec electron-builder
          --mac --arm64 --x64
          --config electron-builder.config.js
          -c.extraMetadata.version=${{ steps.v.outputs.version }}
          -c.mac.identity=null -c.mac.notarize=false
          --publish always
        env:
          BYCONVO_CHANNEL: beta
          GH_TOKEN: ${{ secrets.BETA_GITHUB_TOKEN }}
