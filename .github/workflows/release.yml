name: release

# A push to `main` whose root package.json carries a version that has not been
# released yet builds Reviewer.app, signs it with the Developer ID certificate,
# notarizes and staples it, and publishes the disk image as GitHub release
# vX.Y.Z of this repository. Bumping the version is the "ship it" signal: a
# push that leaves package.json alone starts no run at all, and one that edits
# it without a new version stops at the first, seconds-long job. Nothing else —
# no other branch, no pull request — releases anything. See RELEASING.md.
#
# Secrets (GITHUB_TOKEN is built in — the release lives in this repository):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD      Developer ID Application .p12 (base64) + its password
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER App Store Connect API key (.p8, base64) for notarytool
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      # A version counts as released once a published release carries its disk
      # image. A draft left by a failed upload does not count and is rebuilt.
      # A published release *without* one is a tag the retired Electron app
      # already took (v0.1.0, v0.2.0–v0.2.8): that is never overwritten — the
      # run fails and asks for a version past it.
      - name: Decide whether this version still needs releasing
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          release="$(gh release view "v${version}" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null || echo '{}')"
          if jq -e --arg v "$version" '.isDraft == false and any(.assets[]; .name | test("^Reviewer-\($v)-.+\\.dmg$"))' <<<"$release" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v${version} is already released — bump the version in package.json to ship a new one."
          elif jq -e '.isDraft == false' <<<"$release" >/dev/null 2>&1; then
            echo "::error::v${version} is already a release without a macOS disk image. Bump package.json past it."
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v${version}."
          fi

  check:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/check.yml

  release:
    needs: [version, check]
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The previous release's tag bounds the generated release notes.
          fetch-depth: 0

      - uses: ./.github/actions/setup-mac

      - name: Import the Developer ID certificate
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # bundle.sh signs for notarization (hardened runtime, timestamps) only
      # when handed a Developer ID identity by name, so the name is read back
      # from the keychain rather than kept in a secret of its own.
      - name: Resolve the signing identity
        run: |
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity in APPLE_CERTIFICATE."
            exit 1
          fi
          echo "SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      - name: Build and sign Reviewer.app
        run: pnpm build:mac

      - name: Check the bundle carries the version being released
        run: |
          bundled="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" packages/mac-os/.build/Reviewer.app/Contents/Info.plist)"
          if [[ "$bundled" != "$VERSION" ]]; then
            echo "::error::Reviewer.app says ${bundled}, package.json says ${VERSION}."
            exit 1
          fi

      - name: Notarize and package the disk image
        id: dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: echo "path=$(packages/mac-os/scripts/release.sh packages/mac-os/.build/Reviewer.app "$RUNNER_TEMP/release")" >> "$GITHUB_OUTPUT"

      # Notes are GitHub's generated list of what merged since the release
      # just below this one — found by version order, not date, since the
      # Electron-era tags sit above the mac app's first versions.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          previous="$( (git tag -l 'v[0-9]*' | sed 's/^v//'; echo "$VERSION") | sort -uV | grep -B1 -x "$VERSION" | head -1)"
          notes_range=()
          if [[ "$previous" != "$VERSION" ]]; then
            notes_range=(--notes-start-tag "v${previous}")
          fi
          if [[ "$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" == "true" ]]; then
            gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "v${VERSION}" "$DMG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Reviewer v${VERSION}" \
            --notes "Signed and notarized. For Apple silicon Macs on macOS 26 or later; Reviewer runs its server with the \`node\` on your login shell's PATH." \
            --generate-notes ${notes_range[@]+"${notes_range[@]}"} \
            --latest

  # Tells installed apps about the release: reviewer.sh/latest.json is built
  # from package.json's version, and the app offers the download once it
  # reads a newer one there (see the app's `UpdateCheck`).
  announce:
    needs: release
    uses: ./.github/workflows/deploy-www.yml
    secrets: inherit
