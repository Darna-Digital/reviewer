name: release

# Signed, notarized macOS release with auto-update metadata. Publishing is
# driven by pushing a version tag (e.g. `v0.1.1`) that matches the desktop
# package version; workflow_dispatch builds without publishing.
#
# Until the Apple signing secrets are configured this still runs end-to-end: it
# produces an unsigned build and uploads it as a workflow artifact instead of
# signing, notarizing, and publishing a release. Add the secrets below and the
# same tag push becomes a full signed release with no further changes:
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  password for that .p12
#   APPLE_API_KEY               base64 of the App Store Connect API .p8 key
#   APPLE_API_KEY_ID            the key's ID
#   APPLE_API_ISSUER            the key's issuer ID

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    env:
      # Presence of the certificate secret decides signed-release vs unsigned-
      # artifact. `secrets` can't be read in step `if:` directly, so surface it
      # as a job env value here.
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Write App Store Connect API key
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer, server, and main process
        run: pnpm build:desktop

      - name: Package, sign, notarize, and publish
        if: env.HAS_SIGNING == 'true'
        run: pnpm --filter @byconvo/desktop exec electron-builder --mac --arm64 --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package unsigned (no signing secrets configured)
        if: env.HAS_SIGNING != 'true'
        run: pnpm --filter @byconvo/desktop exec electron-builder --mac --arm64 --x64 --publish never -c.mac.identity=null -c.mac.notarize=false

      - name: Upload unsigned build
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: byconvo-desktop-macos-unsigned
          path: packages/desktop/dist-packaged/**
