name: release

# A push to `main` whose root package.json carries a version that has not been
# released yet builds Reviewer.app, signs it with the Developer ID certificate,
# notarizes and staples it, and publishes the disk image as GitHub release
# vX.Y.Z of this repository, with the appcast.xml installed apps update from. Bumping the version is the "ship it" signal: a
# push that leaves package.json alone starts no run at all, and one that edits
# it without a new version stops at the first, seconds-long job. Nothing else —
# no other branch, no pull request — releases anything. See RELEASING.md.
#
# Secrets (GITHUB_TOKEN is built in — the release lives in this repository):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD      Developer ID Application .p12 (base64) + its password
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER App Store Connect API key (.p8, base64) for notarytool
#   SPARKLE_PRIVATE_KEY                                 EdDSA key the appcast signs the disk image with (generate_keys -x)
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      # A version counts as released once a published release carries its disk
      # image. A draft left by a failed upload does not count and is rebuilt.
      # A published release *without* one is a tag the retired Electron app
      # already took (v0.1.0, v0.2.0–v0.2.8): that is never overwritten — the
      # run fails and asks for a version past it.
      - name: Decide whether this version still needs releasing
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          release="$(gh release view "v${version}" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null || echo '{}')"
          if jq -e --arg v "$version" '.isDraft == false and any(.assets[]; .name | test("^Reviewer-\($v)-.+\\.dmg$"))' <<<"$release" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v${version} is already released — bump the version in package.json to ship a new one."
          elif jq -e '.isDraft == false' <<<"$release" >/dev/null 2>&1; then
            echo "::error::v${version} is already a release without a macOS disk image. Bump package.json past it."
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v${version}."
          fi

  check:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/check.yml

  release:
    needs: [version, check]
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The previous release's tag bounds the generated release notes.
          fetch-depth: 0

      # Checked before the build rather than after it: without the key the
      # release could not be signed for Sparkle, and notarizing first would
      # only spend twenty minutes finding that out.
      - name: Require the Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set — see RELEASING.md."
            exit 1
          fi

      - uses: ./.github/actions/setup-mac

      - name: Import the Developer ID certificate
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # bundle.sh signs for notarization (hardened runtime, timestamps) only
      # when handed a Developer ID identity by name, so the name is read back
      # from the keychain rather than kept in a secret of its own.
      - name: Resolve the signing identity
        run: |
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity in APPLE_CERTIFICATE."
            exit 1
          fi
          echo "SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        run: |
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      - name: Build and sign Reviewer.app
        run: pnpm build:mac

      - name: Check the bundle carries the version being released
        run: |
          bundled="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" packages/mac-os/.build/Reviewer.app/Contents/Info.plist)"
          if [[ "$bundled" != "$VERSION" ]]; then
            echo "::error::Reviewer.app says ${bundled}, package.json says ${VERSION}."
            exit 1
          fi

      - name: Notarize and package the disk image
        id: dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: echo "path=$(packages/mac-os/scripts/release.sh packages/mac-os/.build/Reviewer.app "$RUNNER_TEMP/release")" >> "$GITHUB_OUTPUT"

      # The release just below this one, found by version order, not date,
      # since the Electron-era tags sit above the mac app's first versions.
      # Empty for the first release.
      - name: Find the previous release
        run: |
          previous="$( (git tag -l 'v[0-9]*' | sed 's/^v//'; echo "$VERSION") | sort -uV | grep -B1 -x "$VERSION" | head -1)"
          if [[ "$previous" == "$VERSION" ]]; then previous=""; fi
          echo "PREVIOUS=${previous}" >> "$GITHUB_ENV"

      # The update window's notes are the commit subjects since the previous
      # release: work is pushed rather than merged through pull requests, so
      # GitHub's generated notes would often be just a compare link.
      - name: Write the Sparkle feed
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          git log --no-merges --format='- %s' ${PREVIOUS:+"v${PREVIOUS}..HEAD"} | { grep -v '^- Release v' || true; } > "$notes"
          appcast="$(dirname "$DMG")/appcast.xml"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/$(basename "$DMG")"
          packages/mac-os/scripts/appcast.sh "$DMG" "$notes" "$url" > "$appcast"
          cat "$appcast"
          echo "path=${appcast}" >> "$GITHUB_OUTPUT"

      # The appcast rides on the same release as the image it names, so the
      # feed at releases/latest/download/appcast.xml always points at a disk
      # image that exists. Notes are GitHub's generated list since the
      # previous release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG: ${{ steps.dmg.outputs.path }}
          APPCAST: ${{ steps.appcast.outputs.path }}
        run: |
          notes_range=()
          if [[ -n "$PREVIOUS" ]]; then
            notes_range=(--notes-start-tag "v${PREVIOUS}")
          fi
          if [[ "$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" == "true" ]]; then
            gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "v${VERSION}" "$DMG" "$APPCAST" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Reviewer v${VERSION}" \
            --notes "Signed and notarized. For Apple silicon Macs on macOS 26 or later." \
            --generate-notes ${notes_range[@]+"${notes_range[@]}"} \
            --latest

  # Moves reviewer.sh onto the release: its Download button, and the
  # /latest.json that builds from before Sparkle (0.0.4 and older) read to
  # offer the download by hand. Builds with Sparkle read the appcast above.
  # The check job above already passed on this commit, so it is not rerun.
  announce:
    needs: release
    uses: ./.github/workflows/deploy-www.yml
    with:
      checked: true
    secrets: inherit
