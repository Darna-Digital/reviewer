name: desktop

on:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/desktop/**"
      - "packages/embedded-server/**"
      - "packages/spa/**"
  workflow_dispatch:

jobs:
  package-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      # Deleting artifacts is a write against the Actions API.
      actions: write
    steps:
      - uses: actions/checkout@v4

      # This is the only workflow that uploads anything, and every run uploads a
      # whole packaged app, so the store fills up on its own until GitHub starts
      # refusing new uploads ("Artifact storage quota has been hit") and the job
      # fails on a build that succeeded. Keeping the newest few and dropping the
      # rest bounds the total at a few builds' worth.
      #
      # It runs first rather than next to the upload so that a run whose build
      # fails still frees space — which is exactly the run you get once the
      # quota is already full. Note that it cannot rescue the run it happens in:
      # GitHub recalculates storage usage every 6-12 hours, so freeing space
      # only helps later runs. See the upload step for how that is handled.
      - name: Prune old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 3
            const { owner, repo } = context.repo
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            )
            const stale = artifacts
              .filter((artifact) => !artifact.expired)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))
              .slice(KEEP)
            const gb = (bytes) => (bytes / 1024 ** 3).toFixed(2)
            core.info(
              `${artifacts.length} artifacts, ${gb(artifacts.reduce((sum, a) => sum + a.size_in_bytes, 0))} GB; ` +
                `keeping the newest ${KEEP}, deleting ${stale.length}`
            )
            let freed = 0
            for (const artifact of stale) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                })
                freed += artifact.size_in_bytes
              } catch (error) {
                // One artifact that will not delete is not worth failing the
                // build over — the upload below is what actually matters.
                core.warning(`could not delete ${artifact.name} (${artifact.id}): ${error.message}`)
              }
            }
            core.info(`freed ${gb(freed)} GB`)

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        run: pnpm pack:desktop

      # What this job is for is the step above: proving the desktop app still
      # packages on macOS. The upload is a convenience on top of that — a build
      # to download while a PR is being looked at — so a storage quota the prune
      # above cannot clear in time must not turn a good build red. The step
      # still runs, and still reports its error in the log; it just doesn't fail
      # the job. A packaging failure is caught by `pnpm pack:desktop` itself.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reviewer-desktop-macos
          path: packages/desktop/dist-packaged/**
          # A PR build is interesting for about as long as the PR is being
          # looked at. The default is 90 days, which is what let a few hundred
          # megabytes per run add up to the quota.
          retention-days: 7
