name: release-prod

# Production channel. A push to `main` publishes the version in
# packages/desktop/package.json to darna-digital/reviewer — but only once that
# version has a COMPLETE release (one carrying latest-mac.yml, the auto-update
# manifest). Bumping the version is the "ship it" signal; other merges are
# no-ops, and a half-finished release from a failed run is repaired rather than
# skipped.
#
# Publishing is done with the gh CLI, not electron-builder's own publisher:
# electron-builder's multi-arch publish races on release creation (one arch
# wins, the other's duplicate create fails with "must have a valid tag"),
# leaving an incomplete release. Building with --publish never and then a single
# `gh release create` avoids the race and anchors the tag correctly. The app
# still learns where to check for updates from the publish block baked into
# app-update.yml by electron-builder.config.js.
#
# Secrets (GITHUB_TOKEN is built in — publishing is to this same repo):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD  Developer ID .p12 (base64) + password
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER  App Store Connect API key for notarization

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Lint / format / test first; the release only runs if this passes.
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    # macOS 26 image: packaging compiles assets/Reviewer.icon with actool, which
    # needs the image's default Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Resolve version and decide whether to release
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A version counts as released only if it has a COMPLETE release —
          # one whose assets include latest-mac.yml. A missing release, or a
          # partial one from a failed run, is (re)built and repaired.
          if gh release view "v$VERSION" --repo "${{ github.repository }}" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'latest-mac.yml'; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION already has a complete release — nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing v$VERSION."
          fi

      - uses: pnpm/action-setup@v4.1.0
        if: steps.v.outputs.release == 'true'

      - uses: actions/setup-node@v4.4.0
        if: steps.v.outputs.release == 'true'
        with:
          node-version: lts/*
          cache: pnpm

      - name: Import signing certificate
        if: steps.v.outputs.release == 'true'
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Write App Store Connect API key
        if: steps.v.outputs.release == 'true'
        run: echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"

      - name: Install dependencies
        if: steps.v.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build renderer, server, and main process
        if: steps.v.outputs.release == 'true'
        run: pnpm build:desktop

      # Sign + notarize both arches and generate the update artifacts (dmg, zip,
      # blockmap, latest-mac.yml) into dist-packaged. --publish never: gh does the
      # publishing below.
      - name: Package, sign, and notarize
        if: steps.v.outputs.release == 'true'
        run: >
          pnpm --filter @reviewer/desktop exec electron-builder
          --mac --arm64 --x64
          --config electron-builder.config.js
          --publish never
        env:
          REVIEWER_CHANNEL: prod
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Stream signing + notarization progress instead of a silent spinner.
          DEBUG: electron-builder

      - name: Verify update manifest and artifacts exist
        if: steps.v.outputs.release == 'true'
        run: |
          ls -la packages/desktop/dist-packaged/
          test -f packages/desktop/dist-packaged/latest-mac.yml \
            || { echo "::error::latest-mac.yml was not generated — auto-update would break"; exit 1; }

      - name: Publish to reviewer
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove any incomplete release + tag left by a failed prior run so the
          # create below starts clean.
          gh release delete "v${{ steps.v.outputs.version }}" \
            --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "v${{ steps.v.outputs.version }}" \
            packages/desktop/dist-packaged/*.dmg \
            packages/desktop/dist-packaged/*.zip \
            packages/desktop/dist-packaged/*.blockmap \
            packages/desktop/dist-packaged/latest-mac.yml \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Reviewer v${{ steps.v.outputs.version }}" \
            --notes "Signed and notarized production release. macOS auto-updates from here."
