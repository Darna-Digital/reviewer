name: mac

# Proves a pull request still builds the macOS app: the SPA, the server bundle
# and the Swift package, assembled into Reviewer.app exactly as a release is,
# only ad-hoc signed — no certificates or secrets are needed, so it runs for
# any branch. Signing, notarization and publishing are release.yml's.
on:
  pull_request:
    paths-ignore:
      - "packages/www/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # The image releases are built on (see `release.yml`): Xcode 27 and its
    # macOS 27 SDK, which the app's tabs need, and whose actool compiles the
    # dock icon.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-mac

      - name: Build Reviewer.app
        run: pnpm build:mac

      - name: Verify the bundle's signature seals everything in it
        run: codesign --verify --deep --strict --verbose=2 packages/mac-os/.build/Reviewer.app
