name: deploy-www

# reviewer.sh. Only the marketing site is deployed from here —
# the cloud's Workers are the Alchemy stack in the reviewer-cloud repository.
#
# release.yml calls this too, once a release is published: the site's
# Download button and /latest.json carry the released version, and are only
# redeployed after the disk image they point at exists.
on:
  push:
    branches: [main]
    paths:
      - "packages/www/**"
      # reviewer.sh/install serves this file, read at build time.
      - "packages/tui/release/install.sh"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-www.yml"
  workflow_call:
    inputs:
      # Set by a caller that already ran check.yml on this commit.
      checked:
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: deploy-www
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !inputs.checked }}
    uses: ./.github/workflows/check.yml

  # A skipped check would skip this job too, so only a failed one stops it.
  deploy:
    needs: check
    if: ${{ !cancelled() && needs.check.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://reviewer.sh
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `vite build`, then `wrangler deploy` against the config the build wrote
      # beside the bundle. The Worker's name and its custom domain come from
      # packages/www/wrangler.jsonc, so there is nothing to keep in sync here.
      #
      # The Worker's own secrets ride along: the usage rollup's cron reads
      # Analytics Engine back through the SQL API (packages/www/src/lib/
      # usage-rollup.ts), as this account, with a token that can only read
      # analytics — never the deploy token, which could redeploy the site.
      # Until CLOUDFLARE_ANALYTICS_TOKEN is set the token is left out, and the
      # rollup skips with a warning in the Worker's logs.
      #
      # No secret is in this file: GitHub fills in `secrets.*` at run time,
      # only for this job (pull requests, forks included, never run it), and
      # masks the values in the log. The file wrangler reads them from is
      # readable by the runner's user only and removed even if the deploy
      # fails.
      - name: Deploy
        run: |
          umask 077
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          jq -n '{CF_ACCOUNT_ID: env.CLOUDFLARE_ACCOUNT_ID}
            + if env.ANALYTICS_API_TOKEN != "" then {ANALYTICS_API_TOKEN: env.ANALYTICS_API_TOKEN} else {} end' > "$secrets"
          pnpm --filter www run deploy --secrets-file "$secrets"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
