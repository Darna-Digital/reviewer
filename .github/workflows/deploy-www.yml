name: deploy-www

# reviewer.sh. Only the marketing site is deployed from here —
# the cloud's Workers are the Alchemy stack in the reviewer-cloud repository.
#
# release.yml calls this too, once a release is published: the site's
# Download button and /latest.json carry the released version, and are only
# redeployed after the disk image they point at exists.
on:
  push:
    branches: [main]
    paths:
      - "packages/www/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-www.yml"
  workflow_call:
    inputs:
      # Set by a caller that already ran check.yml on this commit.
      checked:
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: deploy-www
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !inputs.checked }}
    uses: ./.github/workflows/check.yml

  # A skipped check would skip this job too, so only a failed one stops it.
  deploy:
    needs: check
    if: ${{ !cancelled() && needs.check.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://reviewer.sh
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `vite build`, then `wrangler deploy` against the config the build wrote
      # beside the bundle. The Worker's name and its custom domain come from
      # packages/www/wrangler.jsonc, so there is nothing to keep in sync here.
      - name: Deploy
        run: pnpm --filter www run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
