name: codesign
description: Import the Developer ID certificate, export its identity as SIGN_IDENTITY, and write the App Store Connect key to APPLE_API_KEY_PATH — what signing and notarizing on a macOS runner need.

inputs:
  certificate:
    description: base64 of the Developer ID Application .p12
    required: true
  certificate-password:
    description: that .p12's password
    required: true
  api-key:
    description: base64 of the App Store Connect API key (.p8)
    required: true

runs:
  using: composite
  steps:
    - name: Import the Developer ID certificate
      uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466
      with:
        keychain: build
        p12-file-base64: ${{ inputs.certificate }}
        p12-password: ${{ inputs.certificate-password }}

    # The scripts sign for notarization (hardened runtime, timestamps) only
    # when handed a Developer ID identity by name, so the name is read back
    # from the keychain rather than kept in a secret of its own.
    - name: Resolve the signing identity
      shell: bash
      run: |
        identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
        if [[ -z "$identity" ]]; then
          echo "::error::No Developer ID Application identity in APPLE_CERTIFICATE."
          exit 1
        fi
        echo "SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"

    - name: Write the App Store Connect API key
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
      run: |
        echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
        echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
