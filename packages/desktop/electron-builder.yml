appId: com.bemybond.desktop
productName: Byconvo
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true

# @lydell/node-pty ships prebuilt, ABI-stable (N-API) binaries per platform, so
# no native rebuild is needed at package time — the matching prebuilt loads under
# Electron's Node (ELECTRON_RUN_AS_NODE) as-is, on both arm64 and x64.
npmRebuild: false
# Native modules can't be dlopen'd from inside the asar, so keep the pty binary
# (and any other .node) unpacked next to it. The prebuilt and its spawn-helper
# live in the per-platform @lydell/node-pty-<os>-<arch> package.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/@lydell/**"

directories:
  output: dist-packaged

files:
  - from: dist
    to: dist
    filter:
      - "**/*"
  - from: assets
    to: assets
    filter:
      - "**/*"
  - from: ../spa/dist/client
    to: renderer
    filter:
      - "**/*"
  - from: ../embedded-server/dist
    to: server
    filter:
      - "**/*"
  # Production dependencies (@lydell/node-pty + its platform binary packages,
  # electron-updater). electron-builder prunes this to the production dependency
  # tree, so devDeps (electron, etc.) are skipped.
  - "node_modules/**/*"
  - package.json

mac:
  category: public.app-category.developer-tools
  icon: assets/byconvo.icns
  # Gatekeeper requires distributed apps to be signed with a Developer ID
  # certificate and notarized by Apple. `identity` is left unset so
  # electron-builder auto-discovers the "Developer ID Application" cert imported
  # into the keychain by CI; hardenedRuntime + entitlements are prerequisites for
  # notarization, which runs automatically via the APPLE_API_* env vars.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.plist
  entitlementsInherit: assets/entitlements.plist
  notarize: true
  # dmg for first install; zip is what electron-updater downloads to self-update.
  target:
    - dmg
    - zip

# electron-updater reads this from the baked-in app-update.yml to find new
# releases. The GitHub Release must carry the .zip, its .blockmap, and
# latest-mac.yml — all produced by the release workflow.
publish:
  provider: github
  owner: darna-digital
  repo: byconvo
